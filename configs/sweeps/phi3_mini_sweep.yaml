name: "phi3_mini_sweep"

model:
  model_id: "microsoft/Phi-3-mini-4k-instruct"
  model_name: "Phi-3-mini-4k"
  revision: "main"
  dtype: "float16"
  device_map: "auto"
  trust_remote_code: true

bitflip:
  rates:
    - 1.0e-10
    - 3.0e-10
    - 1.0e-09
    - 3.0e-09
    - 1.0e-08
    - 2.0e-08
    - 3.0e-08
    - 5.0e-08
    - 7.0e-08
    - 1.0e-07
    - 1.0e-06
    - 1.0e-05
    - 1.0e-04
    - 1.0e-03
  trials_per_rate: 3
  seed_base: 42

benchmarks:
  - name: "hellaswag"
    tasks:
      - "hellaswag"
    num_fewshot: 10
    limit: 200
    batch_size: "auto"
  - name: "mmlu"
    tasks:
      - "mmlu"
    num_fewshot: 5
    limit: 200
    batch_size: "auto"

wandb:
  project: "llm-radiation"
  enabled: true
  tags:
    - "phi3-mini"
    - "cliff_investigation"

adaptive:
  enabled: false

output_dir: "results/phi3_mini_sweep"
