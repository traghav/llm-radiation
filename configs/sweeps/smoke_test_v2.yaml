name: "smoke_test_v2_tinyllama"

model:
  model_id: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  model_name: "TinyLlama-1.1B-Chat"
  revision: "main"
  dtype: "float16"
  device_map: "auto"
  trust_remote_code: false

bitflip:
  rates:
    # Fine resolution around the cliff (1e-10 to 1e-7)
    - 1.0e-10
    - 3.0e-10
    - 1.0e-09
    - 3.0e-09
    - 1.0e-08
    - 2.0e-08
    - 3.0e-08
    - 5.0e-08
    - 7.0e-08
    - 1.0e-07
    # Coarser above the cliff to confirm total breakdown
    - 1.0e-06
    - 1.0e-05
    - 1.0e-04
    - 1.0e-03
  trials_per_rate: 3
  seed_base: 42

benchmarks:
  - name: "hellaswag"
    tasks:
      - "hellaswag"
    num_fewshot: 10
    limit: 200
    batch_size: "auto"
  - name: "mmlu"
    tasks:
      - "mmlu"
    num_fewshot: 5
    limit: 200
    batch_size: "auto"

wandb:
  project: "llm-radiation"
  enabled: true
  tags:
    - "smoke_test_v2"
    - "tinyllama"
    - "cliff_investigation"

adaptive:
  enabled: false

output_dir: "results/smoke_test_v2"
